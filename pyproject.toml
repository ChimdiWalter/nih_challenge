[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "invariantcell"
version = "0.6.0"
description = "Shared perturbation prediction, temporal provenance, and decision evaluation"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = ["PyYAML==6.0.3"]

[project.optional-dependencies]
real = ["numpy==2.4.3", "h5py==3.14.0"]
arc = ["cell-eval2==0.16.0", "polars==1.44.2", "anndata==0.12.10", "scanpy==1.12.1"]

format = ["numpy==2.4.3", "scipy==1.16.3", "h5py==3.14.0", "anndata==0.12.10"]
ontology = ["rdflib==7.6.0", "pyshacl==0.40.1", "owlrl==7.6.2"]

[project.scripts]
invariantcell = "invariantcell.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invariantcell = ["*.md"]
